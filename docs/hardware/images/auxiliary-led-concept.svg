<rect x="781" y="119" width="339" height="429" rx="16" fill="#13283c" stroke="#3b556a"/>
<text x="804" y="166" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Integration checklist</text>
