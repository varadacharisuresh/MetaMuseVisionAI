<text x="815" y="505" fill="#fbe5ac" font-size="12" font-family="Arial,sans-serif">No flashlight module selected or tested</text>
<text x="40" y="581" font-family="Arial,sans-serif" font-size="14" fill="#8ca8bf">A light can improve exposure; it cannot guarantee autofocus lock or compensate for poor optics.</text>
