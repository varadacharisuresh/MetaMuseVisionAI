<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="610" viewBox="0 0 1160 610" role="img" aria-labelledby="t d">
<title id="t">Proposed diffused LED illumination for Meta Muse Vision AI camera</title>
<desc id="d">Concept diagram of an optional controllable white LED with diffuser aimed towards an object, separate from the already illuminated GM77 scanner.</desc>
