<title id="t">GM77 640 by 480 CMOS barcode scanner - conceptual module diagram</title>
<desc id="d">Technical illustration of the proposed GM77 scanner with lens and integrated illumination and reference characteristics. Not a manufacturer photo and not a pinout.</desc>
