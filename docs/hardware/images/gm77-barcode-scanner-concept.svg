<!-- facts -->
<rect x="572" y="119" width="547" height="438" rx="15" fill="#12273d" stroke="#45607a"/>
<text x="603" y="165" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#9de8d3">Reference specifications</text>
<g font-family="Arial,sans-serif" font-size="19" fill="#e5f3ff">
<text x="603" y="212">Sensor</text><text x="836" y="212" font-weight="700">640 x 480 CMOS</text>
<text x="603" y="253">Input power</text><text x="836" y="253" font-weight="700">DC 5V</text>
<text x="603" y="294">Active current</text><text x="836" y="294" font-weight="700">180mA nominal</text>
<text x="603" y="335">Interfaces</text><text x="836" y="335" font-weight="700">USB / TTL-232</text>
<text x="603" y="376">USB modes</text><text x="836" y="376" font-weight="700">HID / virtual COM</text>
<text x="603" y="417">Dimensions</text><text x="836" y="417" font-weight="700">27.5 x 48.5 x 14mm</text>
<text x="603" y="458">Reads</text><text x="836" y="458" font-weight="700">1D, QR, Data Matrix, etc.</text>
</g>
<rect x="602" y="479" width="488" height="55" rx="8" fill="#503821" stroke="#eab76a"/>
<text x="618" y="501" font-family="Arial,sans-serif" font-size="15" fill="#ffe5ae" font-weight="700">Short-range design - not a 3-foot scanner</text>
<text x="618" y="521" font-family="Arial,sans-serif" font-size="14" fill="#f2dcb9">EAN-13 typically specified around 50-220mm.</text>
<text x="42" y="592" font-family="Arial,sans-serif" font-size="15" fill="#a7bfd3">*Connector drawing is illustrative, NOT a wiring diagram or pinout. Confirm variant and pinout before connecting.</text>
<text x="42" y="617" font-family="Arial,sans-serif" font-size="13" fill="#6f96b0">Proposed accessory - not installed or verified in the current headset prototype.</text>
